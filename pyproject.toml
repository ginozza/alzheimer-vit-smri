[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimer-vit-smri"
version = "0.1.0"
description = "Prodromal Alzheimer's Disease Detection using Vision Transformers on Structural MRI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Malak Sanchez" },
    { name = "Juan Simancas" }
]
dependencies = [
    "nibabel>=5.3,<6",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0"
]
reports = [
    "reportlab>=5,<6",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
