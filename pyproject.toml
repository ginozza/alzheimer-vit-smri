[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimer-vit-smri"
version = "0.1.0"
description = "Prodromal Alzheimer's Disease Detection using Vision Transformers on Structural MRI"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Malak Sanchez" },
    { name = "Juan Simancas" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = ["src"]
